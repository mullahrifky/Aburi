<html lang="id">

<style>

html,body{height:100%;margin:0}

.b{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}
.u{background:var(--me);color:var(--meink);align-self:flex-end;border-bottom-right-radius:4px}
.t{color:var(--mute);font-size:13px}

.mouth{transition:d .2s}

.card:active{transform:translateY(1px);box-shadow:0 2px 0 var(--line)}
.ce{font-size:44px;line-height:1}
#go{position:fixed;inset:0;z-index:30;background:linear-gradient(135deg,#ff7a3d,#ffb36b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;padding:24px}
#go[hidden]{display:none}
#go h2{margin:0;font-size:26px}

#mas{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:76px;height:76px;cursor:pointer;z-index:5;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));-webkit-tap-highlight-color:transparent}

#bub.on{opacity:1;transform:none}
#chat{padding-bottom:96px}
#cam{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
#cam[hidden]{display:none}
#cam .box{background:var(--card);border-radius:20px;padding:12px;width:min(94vw,440px);max-height:96vh;overflow:auto;text-align:center}
.frame{position:relative;width:min(100%,calc(58vh*0.75));aspect-ratio:3/4;margin:0 auto;border-radius:14px;overflow:hidden;background:#222}
.frame video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#pose{position:absolute;right:2%;bottom:0;height:48%;pointer-events:none}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:900;color:#fff;text-shadow:0 2px 14px #000;pointer-events:none}
#camNote{font-size:13px;color:var(--mute);margin:8px 0 2px}
.pb{border:2px solid var(--pri);background:var(--pri);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;margin:4px;display:inline-block}
.pb.o{background:var(--card);color:var(--ink)}
.pb:disabled{opacity:.45}
@media(min-width:1100px){#mas{width:150px;height:150px;right:6vw;bottom:28px}#bub{font-size:15px;max-width:240px}#chat{padding-bottom:14px}}
</style>
